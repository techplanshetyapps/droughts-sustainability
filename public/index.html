<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drought Monitoring & AI Prediction Dashboard</title>
    <style>
        :root {
            --primary: #4e9f3d;
            --primary-hover: #3d7d30;
            --accent: #2d6a4f;
            --accent-light: rgba(216, 243, 220, 0.2);
            --card-bg: oklch(28.6% 0.066 53.813 / 0.66);
            --text-main: #f8faf9;
            --text-muted: #cbd5e1;
            --border-color: rgba(255, 255, 255, 0.15);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-image: url('terrapredict-background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh;
        }

        .container { 
            max-width: 1000px; 
            margin: 40px auto; 
            background: var(--card-bg); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--border-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h2 { color: #ffffff; margin: 0; font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        .metrics-badge {
            background: rgba(45, 106, 79, 0.8);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.2);
        }

        form { 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr auto; 
            gap: 15px; 
            margin-bottom: 25px; 
            background: rgba(0, 0, 0, 0.25); 
            padding: 22px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            align-items: center; 
        }

        select, input, button { 
            padding: 12px 14px; 
            font-size: 15px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            background: rgba(255, 255, 255, 0.9); 
            color: #2b2d42;
        }

        input[readonly] { background: rgba(233, 236, 239, 0.9); color: #6c757d; cursor: not-allowed; }

        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s, transform 0.1s; 
        }
        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.98); }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .search-box {
            width: 300px;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: #2b2d42;
        }

        .loading { 
            display: none; 
            color: #ffffff; 
            font-weight: 600; 
            margin-bottom: 15px; 
            text-align: center; 
            background: rgba(45, 106, 79, 0.8);
            padding: 10px;
            border-radius: 8px;
        }

        .table-container { 
            max-height: 420px; 
            overflow-y: auto; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            background: rgba(0, 0, 0, 0.2);
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); color: #f8faf9; }
        th { background: rgba(0, 0, 0, 0.4); position: sticky; top: 0; z-index: 1; color: #ffffff; font-weight: 600; }
        
        /* Slightly different background tints for alternating rows */
        tr:nth-child(odd) { background: rgba(255, 255, 255, 0.03); }
        tr:nth-child(even) { background: rgba(255, 255, 255, 0.08); }
        tr:hover { background: rgba(255, 255, 255, 0.15); }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .container {
                margin: 15px;
                padding: 20px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            h2 {
                font-size: 1.5rem;
            }

            form {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 15px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .search-box {
                width: 100%; 
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>🌿 Drought Monitoring & AI Dashboard</h2>
        <div id="metricsBadge" class="metrics-badge">Loading Metrics...</div>
    </header>
    
    <form id="droughtForm">
        <select id="townSelect" required>
            <option value="">-- Select Town Region --</option>
        </select>
        <input type="number" id="size" placeholder="Size (sq km)" step="0.1" readonly required>
        <input type="number" id="duration" placeholder="Duration (Days)" readonly required>
        <button type="submit" id="submitBtn">Analyze & Save</button>
    </form>
    
    <div id="loading" class="loading">⏳ Processing analysis and saving record, please wait...</div>

    <div class="toolbar">
        <h3 style="margin: 0; color: #f8faf9;">Recorded Telemetry & AI Insights</h3>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search records by town or keyword...">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Town Region</th>
                    <th>Size (sq km)</th>
                    <th>Duration (Days)</th>
                    <th>AI Risk Assessment & Prediction</th>
                </tr>
            </thead>
            <tbody id="droughtTableBody">
                <!-- Dynamically populated -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById('droughtForm');
    const townSelect = document.getElementById('townSelect');
    const sizeInput = document.getElementById('size');
    const durationInput = document.getElementById('duration');
    const tableBody = document.getElementById('droughtTableBody');
    const loadingDiv = document.getElementById('loading');
    const searchInput = document.getElementById('searchInput');
    const metricsBadge = document.getElementById('metricsBadge');

    let townsData = [];
    let allRecords = [];

    async function loadTowns() {
        try {
            const res = await fetch('/api/towns');
            townsData = await res.json();
            townSelect.innerHTML = '<option value="">-- Select Town Region --</option>';
            townsData.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.town;
                opt.textContent = t.town;
                townSelect.appendChild(opt);
            });
        } catch (err) {
            console.error('Failed to load towns list');
        }
    }

    townSelect.addEventListener('change', (e) => {
        const selectedTownName = e.target.value;
        const found = townsData.find(t => t.town === selectedTownName);
        if (found) {
            sizeInput.value = found.size;
            durationInput.value = found.duration;
        } else {
            sizeInput.value = '';
            durationInput.value = '';
        }
    });

    function renderTable(dataToRender) {
        tableBody.innerHTML = '';
        if (dataToRender.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No matching drought records found.</td></tr>`;
            return;
        }
        dataToRender.forEach(d => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${d.town}</strong></td>
                <td><span class="tag">${d.size} sq km</span></td>
                <td><span class="tag">${d.duration} days</span></td>
                <td>${d.prediction || 'Pending analysis'}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    async function fetchDroughts() {
        try {
            const res = await fetch('/api/droughts');
            allRecords = await res.json();
            metricsBadge.textContent = `Total Zones Tracked: ${allRecords.length}`;
            renderTable(allRecords);
        } catch (err) {
            console.error('Failed to load records');
        }
    }

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allRecords.filter(item => 
            item.town.toLowerCase().includes(term) || 
            (item.prediction && item.prediction.toLowerCase().includes(term))
        );
        renderTable(filtered);
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        loadingDiv.style.display = 'block';

        const payload = {
            town: townSelect.value,
            size: parseFloat(sizeInput.value),
            duration: parseInt(durationInput.value)
        };

        try {
            const response = await fetch('/api/droughts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const resultData = await response.json();
            if (!response.ok) {
                throw new Error(resultData.error || 'Failed to process request');
            }

            form.reset();
            sizeInput.value = '';
            durationInput.value = '';
            await fetchDroughts();
        } catch (err) {
            console.error('Submission error:', err);
            alert('Error: ' + err.message);
        } finally {
            loadingDiv.style.display = 'none';
        }
    });

    loadTowns();
    fetchDroughts();
</script>

</body>
</html>
